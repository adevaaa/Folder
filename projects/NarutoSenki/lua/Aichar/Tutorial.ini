#      Result/   Hagoromo_small.png                           ikon kecil hasil pertandingan
#      Report/   Hagoromo_rp.png  Hagoromo_rpf.png            laporan / peringkat
#      Record/   Hagoromo_full.png                            gambar penuh
#      Ougis/    Hagoromo_CutIn.png                           cut-in ougis
#  Angka di belakang akhiran boleh (Ashura_half2.png, Guy_full2.png, Itachi_full3.png).
#  PNG lepas MENIMPA frame atlas bernama sama (mengganti ikon karakter lama) dan melengkapi karakter
