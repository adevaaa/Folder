#  disalin dari APK saat game pertama dibuka. Edit langsung di situ; skrip di sini dipakai menggantikan
#  yang di APK (main.lua dan require). Perubahan terbaca saat game dibuka ulang.
#      - Skrip salah ketik = game gagal jalan. Hapus file itu (atau folder lua/) lalu buka game: salinan
#        bawaan dibuat ulang.
#      - Hasil edit TIDAK ditimpa saat game dibuka. Kalau APK baru membawa skrip Lua yang berubah, folder
#        lua/ lama dipindah ke lua_old/ dan skrip terbaru disalin ulang (edit lama ada di lua_old/).
#      - Aichar/ (Characters.ini) bukan bagian lua/, letaknya di /sdcard/Aris/Characters.ini.
#
#  Folder kosong dibuat otomatis meniru Resources:
#      Config/ Effects/ Fonts/ GameMode/ Maps/ UI/ UI/hpBar/ Select/ Result/ Report/ Record/ Ougis/
#      Unit/Flog Unit/Guardian Unit/Kuchiyose Unit/Kugutsu Unit/Mon Unit/Ninja Unit/Projectile Unit/Tower
#  File yang Anda letakkan di sini MENIMPA file bernama sama di dalam APK (XML unit, plist, gambar).
#  Letakkan dengan path relatif yang sama seperti di Resources, mis.
#      Aris/Unit/Ninja/Hagoromo/Hagoromo.xml   Aris/Unit/Ninja/Hagoromo/Hagoromo.plist (+ .pvr.ccz / .png)
#
#  IKON KARAKTER = PNG LEPAS, TANPA ATLAS. Letakkan di folder kategorinya, nama file persis:
#      UI/       Hagoromo_skill1.png .. Hagoromo_skill5.png   ikon skill (juga Hagoromo_skill1_1.png untuk skill baru)
